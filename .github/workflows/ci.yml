name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Dependency policy
        run: pnpm check:dependencies

      - name: Validate catalog
        run: pnpm seed:firestore:check

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: account-commerce-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
