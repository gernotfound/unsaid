name: Generate HQ product media

on:
  push:
    branches:
      - "product-media-*"
    paths:
      - "data/media/masters/**"
      - "data/media/templates.json"
      - "data/media/master-intake.json"
      - "data/media/render-profiles.json"
      - "data/catalog/archive.json"
      - "apps/worker/src/media/**"
      - "apps/worker/test/**"
      - ".github/workflows/media-generate.yml"

permissions:
  contents: write

concurrency:
  group: media-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate media configuration
        run: pnpm media:validate

      - name: Render immutable HQ product media
        run: pnpm media:render-products -- --write

      - name: Validate generated manifests
        run: pnpm media:attach-manifests -- --manifests=${{ github.workspace }}/.media-stage/generated-media.json

      - name: Attach manifests to catalog archive
        run: pnpm media:attach-manifests -- --manifests=${{ github.workspace }}/.media-stage/generated-media.json --write-archive

      - name: Validate repository
        run: |
          pnpm media:validate
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/generated data/catalog/archive.json
          if git diff --cached --quiet; then
            echo "Generated media is already up to date."
            exit 0
          fi
          git commit -m "chore: generate HQ product media [media-generated]"
          git push origin HEAD:${{ github.ref_name }}
