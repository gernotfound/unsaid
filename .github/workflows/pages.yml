name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static archive
        run: pnpm --filter @unsaid/web build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/unsaid"
          NEXT_PUBLIC_SITE_URL: "https://gernotfound.github.io/unsaid"
          NEXT_PUBLIC_SHOP_ENABLED: "false"
          CATALOG_SOURCE: "local"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBANjiBKnAjUUmj7YQYTQ8AT2hpeWL-haM"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "unsaid-54c7e.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "unsaid-54c7e"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "unsaid-54c7e.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "246645030452"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:246645030452:web:dca7295a518e84cac49461"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-DBJFXTJRR1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
